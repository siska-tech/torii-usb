name: C protocol tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-debug-tests:
    name: Python UART debug tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r host/python/requirements.txt
      - name: Test decoder and monitor
        run: python -m unittest discover -s host/python -p "test_*.py" -v
      - name: Check CLI
        run: python host/python/torii_debug.py --help

  protocol-tests:
    name: Protocol tests (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: debug
            cflags: ""
            ldflags: ""
          - mode: address-undefined-sanitizers
            cflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            ldflags: "-fsanitize=address,undefined"
    env:
      CFLAGS: ${{ matrix.cflags }}
      LDFLAGS: ${{ matrix.ldflags }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host --parallel
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
